<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>伪造音频检测与算法溯源演示系统</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    body { background: #0b1120; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; }
    .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(148, 163, 184, 0.16); }
    .tab-active { background: linear-gradient(135deg, #2563eb, #0ea5e9); color: #fff; box-shadow: 0 4px 16px rgba(37, 99, 235, 0.35); }
    .drop-active { border-color: #38bdf8 !important; background: rgba(14, 165, 233, 0.12) !important; }
    .wave-bar { transition: height 0.25s ease; }
  </style>
</head>
<body class="min-h-screen">
  <!-- 简洁顶部标题栏 -->
  <header class="sticky top-0 z-30 glass border-b border-slate-800">
    <div class="max-w-6xl mx-auto px-4 py-3.5 flex items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-blue-500 to-cyan-400 flex items-center justify-center font-bold text-slate-950">AF</div>
        <div>
          <h1 class="text-base sm:text-lg font-bold tracking-tight text-white">伪造音频检测与算法溯源系统</h1>
          <p class="text-xs text-slate-400">上传一段语音，快速完成真伪鉴别、特定人声纹防伪与合成算法溯源</p>
        </div>
      </div>
      <span id="gpuBadge" class="text-xs px-3 py-1 rounded-full bg-slate-800 border border-slate-700 text-slate-300">系统初始化中...</span>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-6 space-y-6">
    <!-- 4 大检测模式切换 -->
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-2.5">
      <button id="tab-detect" onclick="switchTab('detect')" class="tab-active py-3 px-4 rounded-xl text-sm font-semibold transition">
        非特定人伪造检测
      </button>
      <button id="tab-sasv" onclick="switchTab('sasv')" class="glass py-3 px-4 rounded-xl text-sm font-semibold text-slate-300 hover:text-white transition">
        特定人防伪验证
      </button>
      <button id="tab-trace" onclick="switchTab('trace')" class="glass py-3 px-4 rounded-xl text-sm font-semibold text-slate-300 hover:text-white transition">
        伪造算法溯源
      </button>
      <button id="tab-analyze" onclick="switchTab('analyze')" class="glass py-3 px-4 rounded-xl text-sm font-semibold text-slate-300 hover:text-white transition">
        一键综合检测
      </button>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
      <!-- 左侧：上传语音与参数区 -->
      <section class="lg:col-span-5 space-y-5">
        <div class="glass rounded-2xl p-5 space-y-4">
          <div class="flex items-center justify-between">
            <h2 class="text-sm font-semibold text-white">上传一段语音</h2>
            <span id="selectedAudioLabel" class="text-xs text-cyan-400 truncate max-w-[190px]">未选择音频</span>
          </div>

          <!-- 拖拽 / 点击上传区 -->
          <label id="dropZone" class="block border-2 border-dashed border-slate-700 hover:border-blue-500 rounded-xl p-7 text-center cursor-pointer transition bg-slate-900/50">
            <input id="audioFileInput" type="file" accept="audio/*,video/mp4,.wav,.flac,.mp3,.ogg,.m4a,.aac,.amr,.webm,.3gp" class="hidden" />
            <div class="text-3xl mb-2">🎧</div>
            <p class="text-sm text-slate-100 font-medium">点击上传或将语音文件拖拽到此处</p>
            <p class="text-xs text-slate-400 mt-1">支持 WAV / FLAC / MP3 / M4A / AAC / AMR / OGG / MP4</p>
          </label>

          <!-- 内置示例语音快捷体验 -->
          <div class="space-y-1.5">
            <label class="text-xs text-slate-400">手头没有音频？也可以直接选一条示例语音体验：</label>
            <select id="sampleSelect" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-slate-200 outline-none focus:border-blue-500">
              <option value="">-- 选择示例语音 --</option>
            </select>
          </div>

          <!-- 音频试听播放器 -->
          <div id="audioPlayerWrap" class="hidden bg-slate-900/80 border border-slate-800 rounded-xl p-3">
            <audio id="audioPlayer" controls class="w-full h-9"></audio>
          </div>
        </div>

        <!-- 特定人目标声纹注册与选择（仅在特定人防伪 / 综合检测模式展示） -->
        <div id="speakerPanel" class="hidden glass rounded-2xl p-5 space-y-4">
          <div class="flex items-center justify-between gap-2">
            <h2 class="text-sm font-semibold text-white">特定目标说话人声纹</h2>
            <button onclick="quickEnrollDemoSpeaker()" class="text-xs px-2.5 py-1 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white transition">
              一键导入示例人 LA_0015
            </button>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
            <input id="enrollSpeakerName" type="text" placeholder="输入姓名或编号" class="sm:col-span-2 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white outline-none focus:border-blue-500" />
            <button onclick="enrollCurrentAudio()" class="px-3 py-2 rounded-lg bg-blue-600 hover:bg-blue-500 text-xs font-medium text-white transition">
              用当前语音注册
            </button>
          </div>

          <div class="space-y-1.5">
            <label class="text-xs text-slate-400">选择要比对的目标说话人：</label>
            <div class="flex gap-2">
              <select id="targetSpeakerSelect" class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white outline-none">
                <option value="">-- 请先注册或一键导入示例人 --</option>
              </select>
              <button onclick="deleteSelectedSpeaker()" class="px-3 py-2 rounded-lg bg-rose-900/60 hover:bg-rose-800 text-rose-200 text-xs transition">删除</button>
            </div>
          </div>
        </div>

        <!-- 模型选择与开始按钮 -->
        <div class="glass rounded-2xl p-5 space-y-4">
          <div id="modelSelectWrap" class="space-y-1.5">
            <label class="text-xs text-slate-400">选择检测模型：</label>
            <select id="cmModelSelect" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-white outline-none">
              <option value="w2v2_aasist">W2V2-AASIST（高精度推荐 · 复杂环境强泛化）</option>
              <option value="aasist">AASIST（轻量图注意力模型）</option>
              <option value="aasist_l">AASIST-L（超轻量极速版）</option>
            </select>
          </div>

          <div id="traceHeadWrap" class="hidden space-y-1.5">
            <label class="text-xs text-slate-400">选择溯源算法库：</label>
            <select id="traceHeadSelect" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-white outline-none">
              <option value="13class">13 类合成/变声算法库 (A07–A19)</option>
              <option value="6class">6 类合成/变声算法库 (A01–A06)</option>
            </select>
          </div>

          <div id="alwaysTraceWrap" class="hidden flex items-center gap-2 text-xs text-slate-300">
            <input id="alwaysTraceCheck" type="checkbox" class="rounded bg-slate-800 border-slate-600" />
            <label for="alwaysTraceCheck">即使判定为真声也同时展示算法溯源分布</label>
          </div>

          <button id="runBtn" onclick="runInference()" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-blue-600 to-cyan-500 hover:from-blue-500 hover:to-cyan-400 text-white font-semibold text-sm shadow-lg shadow-blue-900/30 transition">
            开始检测
          </button>
        </div>
      </section>

      <!-- 右侧：检测结果可视化展示区 -->
      <section class="lg:col-span-7">
        <div class="glass rounded-2xl p-6 min-h-[470px] flex flex-col justify-between space-y-5">
          <!-- 初始等待提示 -->
          <div id="emptyState" class="my-auto text-center py-14 space-y-3">
            <div class="w-16 h-16 mx-auto rounded-2xl bg-slate-800/90 border border-slate-700 flex items-center justify-center text-3xl">🎙️</div>
            <h3 class="text-base font-semibold text-white">在左侧上传一段语音，点击「开始检测」</h3>
            <p class="text-xs text-slate-400 max-w-sm mx-auto leading-relaxed">
              系统将自动完成音频真伪判别、特定说话人声纹防伪验证，并对疑似伪造音频定位最可能的合成/变声算法。
            </p>
          </div>

          <!-- 检测结果主体 -->
          <div id="resultContent" class="hidden space-y-5">
            <!-- 核心结论横幅 -->
            <div id="verdictBanner" class="rounded-xl p-5 border flex flex-wrap items-center justify-between gap-3">
              <div>
                <div class="text-xs opacity-80" id="verdictSub">检测结论</div>
                <div class="text-xl font-bold mt-1" id="verdictTitle">-</div>
              </div>
              <div class="text-right">
                <div class="text-xs opacity-80">检测耗时</div>
                <div class="text-lg font-mono font-bold" id="verdictLatency">- ms</div>
              </div>
            </div>

            <!-- 伪造风险直观进度条 -->
            <div id="riskBarWrap" class="hidden bg-slate-900/70 border border-slate-800 rounded-xl p-4 space-y-2">
              <div class="flex justify-between text-xs">
                <span class="text-slate-300 font-medium">伪造风险评分</span>
                <span id="riskBarText" class="font-bold">-</span>
              </div>
              <div class="w-full h-3 rounded-full bg-slate-800 overflow-hidden">
                <div id="riskBarFill" class="h-full rounded-full transition-all duration-500" style="width:0%"></div>
              </div>
            </div>

            <!-- 核心指标卡 -->
            <div id="metricGrid" class="grid grid-cols-2 sm:grid-cols-4 gap-3"></div>

            <!-- 语音波形包络 -->
            <div id="waveformBox" class="hidden bg-slate-900/70 border border-slate-800 rounded-xl p-3.5">
              <div class="text-xs text-slate-400 mb-2">语音波形包络</div>
              <div id="waveformBars" class="h-16 flex items-end gap-[2px]"></div>
            </div>

            <!-- 伪造算法溯源 Top-K 柱状图 -->
            <div id="traceChartBox" class="hidden bg-slate-900/70 border border-slate-800 rounded-xl p-4">
              <div class="text-xs text-slate-300 font-semibold mb-2">疑似合成/变声算法溯源置信度 (%)</div>
              <canvas id="traceChart" height="150"></canvas>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
