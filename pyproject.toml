[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-deepfake-forensics"
version = "1.0.0"
description = "End-to-end Audio Deepfake Detection, Target-Speaker Anti-Spoofing (SASV), and Algorithm Attribution Suite with CLI & Web Demo"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "torchaudio>=2.1.0",
    "numpy>=1.24.0",
    "soundfile>=0.12.1",
    "onnxruntime-gpu>=1.18.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.scripts]
asv-forensics = "asv_forensics.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
